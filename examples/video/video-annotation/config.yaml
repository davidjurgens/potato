# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
task_dir: .
port: 9001
annotation_task_name: Simple Video as Input Example
output_annotation_dir: annotation_output/simple-video-annotation/
export_annotation_format: jsonl
annotation_codebook_url: ''
data_files:
- data/video-as-input.json
item_properties:
  id_key: id
  text_key: text
# The clips live in data/files and are served at /media/<name>. Putting a
# <video> tag in the text field does not work: instance text is sanitised,
# and the tag is stripped, leaving an empty box.
media_directory: data/files
instance_display:
  fields:
  - key: video
    type: video
    label: Video
    display_options:
      autoplay: true
      loop: true
      muted: true
      max_width: 480
user_config:
  allow_all_users: true
  users: []
alert_time_each_instance: 10000000
annotation_schemes:
- annotation_type: multiselect
  name: GIF Reply Appropriateness
  description: How do you feel about this video?
  labels:
  - Happy
  - Sad
  - Angry
  sequential_key_binding: true
site_dir: default
