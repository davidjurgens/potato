# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
#
# 3D CT volume segmentation: DICOM series and NIfTI.
#
#   python examples/image/ct-volume/generate_volume.py      # writes media/
#   python potato/flask_server.py start examples/image/ct-volume/config.yaml -p 8000
#
# Needs: pip install 'potato-annotation[volumes]'
#
# Export a DICOM SEG, or the SEG plus a TID 1500 measurement report (SR) with
# each segment's volume (see docs/annotation-types/science/clinical_formats.md):
#   python -m potato.export -c examples/image/ct-volume/config.yaml -f dicom_seg -o out/seg
#   python -m potato.export -c examples/image/ct-volume/config.yaml -f dicom_sr -o out/sr
annotation_task_name: CT volume segmentation
task_dir: .
output_annotation_dir: annotation_output/
media_directory: media
data_files:
  - data/volumes.json
item_properties:
  id_key: id
  text_key: text
user_config:
  allow_all_users: true
require_password: false

annotation_schemes:
  - annotation_type: volume_annotation
    name: ct_segmentation
    description: Outline the lesion and the bone ring
    labels:
      # `dicom` gives the coded concepts the SEG segment and the SR finding
      # carry. Bone has none, so it gets the generic SNOMED CT "Tissue".
      - name: Lesion
        color: "#e6553a"
        key_value: "1"
        dicom:
          category: {code: "49755003", scheme: SCT, meaning: Morphologically Altered Structure}
          type: {code: "52988006", scheme: SCT, meaning: Lesion}
      - {name: Bone, color: "#3a8ee6", key_value: "2"}
    source_field: volume
    # The first item carries an RTSTRUCT; its "Lesion" ROI becomes the
    # starting mask.
    prefill_rtstruct_field: rtstruct
    default_window: Soft tissue
    # The NIfTI copy has no modality header, so it gets its presets here.
    window_presets:
      - {name: Soft tissue, center: 40, width: 400}
      - {name: Bone, center: 400, width: 1800}
    # Shown under the views. PatientName is in the DICOM header but
    # identifies a patient, so it stays hidden unless also listed under
    # allow_identifying_tags.
    display_tags: [Modality, BodyPartExamined, SliceThickness, SeriesDescription, PatientName]
    allow_identifying_tags: [SeriesDescription]

  - annotation_type: radio
    name: lesion_present
    description: Is there a lesion?
    labels: ["yes", "no"]
