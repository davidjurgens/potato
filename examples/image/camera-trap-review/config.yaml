# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
# Camera-trap review: MegaDetector detections as pre-annotations.
#
# Generated by
#   potato import --input examples/image/camera-trap-review/source/md_output.json \
#       --image-url-prefix /media --output-dir examples/image/camera-trap-review
# from a MegaDetector batch-output file over eight synthetic frames (media/).
# Each image opens with the detector's boxes drawn (labelled with the species
# classification where the file has one), the triage answer chosen from the
# most confident detection, and the species ticked. Detections below
# --md-threshold (0.2) were left out.
#
# Run from the repository root:
#   python potato/flask_server.py start examples/image/camera-trap-review/config.yaml -p 8000
#
# Export the reviewed boxes:
#   python -m potato.export -c examples/image/camera-trap-review/config.yaml -f megadetector -o out/
#   python -m potato.export -c examples/image/camera-trap-review/config.yaml -f camtrap_dp -o out/ \
#       --option timezone=-05:00 --option contributor="Your Name" \
#       --option sampling_design=opportunistic --option capture_method=activityDetection
#   python -m potato.export -c examples/image/camera-trap-review/config.yaml -f darwin_core -o out/
port: 8000
annotation_task_name: Camera-trap review
task_dir: .
output_annotation_dir: annotation_output/
data_files:
- data/md_output.jsonl
item_properties:
  id_key: id
  text_key: image_url
user_config:
  allow_all_users: true
  users: []
site_dir: default
pre_annotation:
  enabled: true
  field: predictions
  allow_modification: true
annotation_schemes:
- annotation_type: radio
  name: triage
  description: What does this image show?
  labels:
  - empty
  - animal
  - person
  - vehicle
  sequential_key_binding: true
- annotation_type: image_annotation
  name: detections
  description: 'Correct the boxes: move or resize them, change the label, delete false
    detections, and draw any animal that was missed.'
  source_field: image_url
  tools:
  - bbox
  zoom_enabled: true
  pan_enabled: true
  labels:
  - name: Odocoileus virginianus
    color: '#f58231'
  - name: Procyon lotor
    color: '#911eb4'
  - name: animal
    color: '#3cb44b'
  - name: person
    color: '#e6194b'
  - name: vehicle
    color: '#4363d8'
- annotation_type: multiselect
  name: species
  description: Which species are present?
  labels:
  - Odocoileus virginianus
  - Procyon lotor
