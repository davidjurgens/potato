# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
# PDF Annotation Example
# Demonstrates annotating PDF documents with entity recognition

annotation_task_name: "PDF Entity Annotation"
task_dir: .
output_annotation_dir: annotation_output
export_annotation_format: jsonl

# Data files
data_files:
  - data/pdf-example.json

# PDFs are served from here. They are local so the example works offline and
# without cross-origin fetches — remote PDF URLs are blocked by CORS unless the
# host opts in, which most do not.
media_directory: media

# Item properties
item_properties:
  id_key: id
  text_key: text

# Instance display with PDF viewer
instance_display:
  fields:
    - key: pdf_url
      type: pdf
      label: "Document"
      span_target: true
      display_options:
        view_mode: scroll
        max_height: 600
        text_layer: true
        show_page_controls: true
    - key: text
      type: text
      label: "Extracted Text"
      display_options:
        collapsible: true
        max_height: 200

# Annotation schemes
annotation_schemes:
  - annotation_type: span
    name: entities
    description: "Highlight and label named entities in the document"
    labels:
      - name: PERSON
      - name: ORGANIZATION
      - name: LOCATION
      - name: DATE

# User configuration
user_config:
  allow_all_users: true
