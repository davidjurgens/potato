# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
#
# Multichannel microscopy: OME-Zarr and OME-TIFF with channel contrast,
# z-slices, time points, regions of interest and per-cell classes.
#
# Install the optional readers first:
#   pip install potato-annotation[microscopy]
#
# Run from the repository root:
#   python potato/flask_server.py start examples/image/multichannel-microscopy/config.yaml -p 8000
#
# The images in media/ are synthetic (see generate_data.py). Tiles are
# composited on the server from the channels the annotator has switched on,
# so the browser needs no WebGL. Export ROIs as GeoJSON, cell classes as CSV
# and class label images as OME-Zarr with:
#   python -m potato.export --config examples/image/multichannel-microscopy/config.yaml --format microscopy --output out/

port: 8000
annotation_task_name: Multichannel microscopy
task_dir: .
output_annotation_dir: annotation_output/
export_annotation_format: jsonl

data_files:
  - data/images.json

item_properties:
  id_key: id
  text_key: note

media_directory: media

user_config:
  allow_all_users: true
  users: []

annotation_schemes:
  - annotation_type: microscopy
    name: cells
    description: "Classify the cells, and outline any region that looks damaged."
    instructions: >-
      Turn channels on and off and set their contrast in the Channels panel. Click a
      cell to select it, then choose its class (or press 1-3). Use Rectangle,
      Polygon or Point to mark regions.
    image_key: image
    # OME-TIFF has no label group of its own; tissue_b names a label TIFF here.
    # OME-Zarr label images (labels/ in the store) are found without this.
    labels_key: cells
    tools: [bbox, polygon, landmark]
    labels:
      - name: damaged
        color: "#e8590c"
      - name: debris
        color: "#868e96"
    cell_labels:
      - name: marker positive
        color: "#f03e3e"
      - name: marker negative
        color: "#4dabf7"
      - name: dividing
        color: "#fab005"
    channels:
      - name: DAPI
        label: "DAPI (nuclei)"
    min_cells: 1
    label_requirement: {required: true}   # min_cells only counts when required
