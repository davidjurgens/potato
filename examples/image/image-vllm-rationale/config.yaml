# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
# Image Classification with Vision-Language-Model Rationales
#
# "VLLM" here means Vision Language Model, not the vLLM inference server. Any
# of the three can serve one: Ollama, a self-hosted vLLM or SGLang server, or a
# commercial API. Which one is chosen in ai-config.yaml, not here.
#
# Unlike YOLO which does object detection with bounding boxes, a VLM can:
# - Generate natural language hints about image content
# - Provide rationales explaining why each label might apply
# - Suggest classification labels with explanations
#
# The Keyword assistant does not appear on image items: highlighting keywords
# in a picture means nothing. It does appear on text items served by the same
# endpoint.
#
# To run this example:
#   1. cp ai-config.yaml.example ai-config.yaml   (it is gitignored)
#   2. edit it to point at whichever server you have
#   3. python potato/flask_server.py start examples/image/image-vllm-rationale/config.yaml -p 8000
#
# Without step 1 the server still boots, but AI support is disabled and no
# assistant appears. `potato validate --strict` fails on that.

port: 8000
annotation_task_name: "Image Classification with AI Rationales"
task_dir: .
output_annotation_dir: annotation_output
export_annotation_format: jsonl

# Data files
data_files:
  - "data/image-classification-example.json"

# Item display settings
item_properties:
  id_key: "id"
  text_key: "image_url"

# Authentication (disabled for demo)
user_config:
  allow_all_users: true
  users: []

# Annotation schemes - radio for single-choice classification
annotation_schemes:
  # Image display (required to show the image with non-image annotation types)
  - annotation_type: image_annotation
    name: image_display
    description: "View the image and answer the questions below."
    tools:
      - bbox
    labels:
      - name: "region_of_interest"
        color: "#FFD700"
        key_value: "r"
    min_annotations: 0  # No annotations required - just displays the image
    zoom_enabled: true
    pan_enabled: true

  - annotation_type: radio
    name: image_category
    description: "What type of scene is shown in this image?"
    labels:
      - name: "indoor"
        key_value: "1"
        tooltip: "Interior spaces like rooms, buildings, stores"
      - name: "outdoor_urban"
        key_value: "2"
        tooltip: "City streets, buildings, urban environments"
      - name: "outdoor_nature"
        key_value: "3"
        tooltip: "Parks, forests, mountains, natural landscapes"
      - name: "outdoor_water"
        key_value: "4"
        tooltip: "Beaches, lakes, oceans, rivers"

  - annotation_type: multiselect
    name: image_content
    description: "What objects or elements are visible in this image? (select all that apply)"
    labels:
      - name: "people"
        key_value: "p"
      - name: "animals"
        key_value: "a"
      - name: "vehicles"
        key_value: "v"
      - name: "buildings"
        key_value: "b"
      - name: "vegetation"
        key_value: "g"
      - name: "water"
        key_value: "w"

# Global AI configuration
# Endpoint details (endpoint_type, model, server URL) are loaded from ai-config.yaml.
# Copy ai-config.yaml.example to ai-config.yaml and fill in your details.
ai_support:
  enabled: true
  ai_config_file: ai-config.yaml

  ai_config:
    # Generation settings (defaults; can be overridden in ai-config.yaml)
    max_tokens: 500
    temperature: 0.1

    # Enable AI for all annotation schemes
    include:
      all: true

  # Cache configuration (recommended for production)
  cache_config:
    disk_cache:
      enabled: true
      path: "annotation_output/vllm_cache.json"
    prefetch:
      warm_up_page_count: 5   # Pre-generate for first 5 images
      on_next: 3              # Prefetch 3 ahead
      on_prev: 1              # Prefetch 1 behind

# Debug mode for development
