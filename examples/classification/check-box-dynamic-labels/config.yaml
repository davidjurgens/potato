# yaml-language-server: $schema=https://potatoannotator.readthedocs.io/en/latest/schemas/potato-config.schema.json
port: 9001
annotation_task_name: Simple Check Box Dynamic Labels Example
task_dir: .
output_annotation_dir: annotation_output/simple-checkbox-dynamic-labels/
export_annotation_format: tsv
annotation_codebook_url: ''
data_files:
- data/dynamic-labels.json
item_properties:
  id_key: id
  text_key: text
user_config:
  allow_all_users: true
  users: []
alert_time_each_instance: 10000000
annotation_schemes:
- annotation_type: multiselect
  name: appropriateness
  description: Which of the following reply is appropriate?
  dynamic_labels: true
  labels:
  - name: '{{instance_obj.labels[0]}}'
  - name: '{{instance_obj.labels[1]}}'
  - name: '{{instance_obj.labels[2]}}'
  sequential_key_binding: true
site_dir: default
